name: train-app-mt02-test

services:
  postgres:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'log_error_verbosity=terse',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_parameter_max_length_on_error=0',
      ]
    environment:
      POSTGRES_USER: mt02_admin
      POSTGRES_PASSWORD: mt02_admin_test_only
      POSTGRES_DB: postgres
      CATALOG_DB_PASSWORD: catalog_mt02_test_only
      GATEWAY_DB_PASSWORD: gateway_mt02_test_only
      IDENTITY_DB_PASSWORD: identity_mt02_test_only
      INVENTORY_DB_PASSWORD: inventory_mt02_test_only
      BOOKING_DB_PASSWORD: booking_mt02_test_only
      PAYMENT_DB_PASSWORD: payment_mt02_test_only
      NOTIFICATION_DB_PASSWORD: notification_mt02_test_only
    ports:
      - '127.0.0.1:25432:5432'
    volumes:
      - mt02-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mt02_admin -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    user: rabbitmq
    hostname: mt02-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mt02
      RABBITMQ_DEFAULT_PASS: mt02_rabbit_test_only
    ports:
      - '127.0.0.1:35672:5672'
      - '127.0.0.1:35673:15672'
    volumes:
      - mt02-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  mt02-postgres:
  mt02-rabbitmq:
