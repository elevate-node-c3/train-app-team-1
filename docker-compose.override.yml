# Local-only database/cache ports for `npm run test:int`.
# Compose loads this file automatically; do not use it in production.
# Non-default ports avoid local service conflicts and Windows reserved ranges.
# Check ranges: `netsh interface ipv4 show excludedportrange protocol=tcp`.
# Integration tests use service roles, not the Postgres superuser.
services:
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432'

  redis:
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
