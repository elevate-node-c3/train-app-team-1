name: train-app

x-build: &build
  context: .
  dockerfile: Dockerfile

x-service: &service
  restart: unless-stopped
  depends_on: &service-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  environment: &service-env
    NODE_ENV: ${NODE_ENV:-development}
    PORT: 3000
    GRPC_PORT: 50051
    REDIS_URL: redis://redis:6379
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-train_app}:${RABBITMQ_PASSWORD:-train_app}@rabbitmq:5672

services:
  postgres:
    image: postgres:17-alpine
    # Constraint DETAIL and failing SQL can contain National-ID comparison tokens.
    command:
      [
        'postgres',
        '-c',
        'log_error_verbosity=terse',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_parameter_max_length_on_error=0',
      ]
    restart: unless-stopped
    environment:
      # Admin and healthcheck credentials; never used by app services.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # The init script creates service roles on first start.
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway_dev}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_dev}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_dev}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Postgres is reachable only inside the Compose network.
    healthcheck:
      # $$ lets the container shell read its own environment.
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-train_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-train_app}
    ports:
      # Local-only UI keeps development passwords off the network.
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      # Local-only mail inbox.
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog:
    <<: *service
    build:
      <<: *build
      args:
        APP: catalog
    environment:
      <<: *service-env
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD:-catalog_dev}@postgres:5432/catalog
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      INVENTORY_GRPC_URL: ${INVENTORY_GRPC_URL:-inventory:50051}

  # The only public app service.
  gateway:
    <<: *service
    build:
      <<: *build
      args:
        APP: gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    environment:
      <<: *service-env
      DATABASE_URL: postgres://gateway:${GATEWAY_DB_PASSWORD:-gateway_dev}@postgres:5432/gateway
      CATALOG_GRPC_URL: ${CATALOG_GRPC_URL:-catalog:50051}
      IDENTITY_GRPC_URL: ${IDENTITY_GRPC_URL:-identity:50051}
      INVENTORY_GRPC_URL: ${INVENTORY_GRPC_URL:-inventory:50051}
      BOOKING_GRPC_URL: ${BOOKING_GRPC_URL:-booking:50051}
      PAYMENT_GRPC_URL: ${PAYMENT_GRPC_URL:-payment:50051}
      NOTIFICATION_GRPC_URL: ${NOTIFICATION_GRPC_URL:-notification:50051}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-1}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-30}
      JWT_PUBLIC_KEY_FILE: /app/config/jwt/dev-public.pem
    volumes:
      # Public key only.
      - ./config/jwt/dev-public.pem:/app/config/jwt/dev-public.pem:ro

  identity:
    <<: *service
    build:
      <<: *build
      args:
        APP: identity
    environment:
      <<: *service-env
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:-identity_dev}@postgres:5432/identity
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      VERIFICATION_CODE_TTL_SECONDS: ${VERIFICATION_CODE_TTL_SECONDS:-600}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-1}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      REFRESH_TOKEN_GRACE_SECONDS: ${REFRESH_TOKEN_GRACE_SECONDS:-10}
      TOKEN_GRACE_SECRET: ${TOKEN_GRACE_SECRET:-change-me-in-production}
      BOOKING_IDENTITY_SERVICE_KEY: ${BOOKING_IDENTITY_SERVICE_KEY:-}
      HOLD_PASSENGER_TOKEN_KEYS: ${HOLD_PASSENGER_TOKEN_KEYS:-}
      NOTIFICATION_IDENTITY_SERVICE_KEY: ${NOTIFICATION_IDENTITY_SERVICE_KEY:-}
      HOLD_PASSENGER_TOKEN_ACTIVE_VERSION: ${HOLD_PASSENGER_TOKEN_ACTIVE_VERSION:-}
      NATIONAL_ID_ACTIVE_KEY_VERSION: ${NATIONAL_ID_ACTIVE_KEY_VERSION:-}
      NATIONAL_ID_ENCRYPTION_KEYS: ${NATIONAL_ID_ENCRYPTION_KEYS:-}
      NATIONAL_ID_BLIND_INDEX_KEY: ${NATIONAL_ID_BLIND_INDEX_KEY:-}
      JWT_PRIVATE_KEY_FILE: /app/config/jwt/dev-private.pem
    volumes:
      # Only identity can sign tokens.
      - ./config/jwt/dev-private.pem:/app/config/jwt/dev-private.pem:ro

  inventory:
    <<: *service
    build:
      <<: *build
      args:
        APP: inventory
    environment:
      <<: *service-env
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD:-inventory_dev}@postgres:5432/inventory
      HOLD_CREATION_ENABLED: ${HOLD_CREATION_ENABLED:-false}
      BOOKING_INVENTORY_SERVICE_KEY: ${BOOKING_INVENTORY_SERVICE_KEY:-}
      HOLD_EXPIRY_WORKER_ENABLED: ${HOLD_EXPIRY_WORKER_ENABLED:-true}
      HOLD_EXPIRY_BATCH_SIZE: ${HOLD_EXPIRY_BATCH_SIZE:-500}
      HOLD_EXPIRY_POLL_INTERVAL_MS: ${HOLD_EXPIRY_POLL_INTERVAL_MS:-250}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${INVENTORY_OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL_MS: ${INVENTORY_OUTBOX_POLL_INTERVAL_MS:-100}
      OUTBOX_PUBLISH_CONCURRENCY: ${INVENTORY_OUTBOX_PUBLISH_CONCURRENCY:-32}
      AMQP_PUBLISH_CONFIRM_TIMEOUT_MS: ${AMQP_PUBLISH_CONFIRM_TIMEOUT_MS:-5000}

  booking:
    <<: *service
    build:
      <<: *build
      args:
        APP: booking
    environment:
      <<: *service-env
      DATABASE_URL: postgres://booking:${BOOKING_DB_PASSWORD:-booking_dev}@postgres:5432/booking
      INVENTORY_GRPC_URL: ${INVENTORY_GRPC_URL:-inventory:50051}
      IDENTITY_GRPC_URL: ${IDENTITY_GRPC_URL:-identity:50051}
      BOOKING_INVENTORY_SERVICE_KEY: ${BOOKING_INVENTORY_SERVICE_KEY:-}
      BOOKING_IDENTITY_SERVICE_KEY: ${BOOKING_IDENTITY_SERVICE_KEY:-}

  payment:
    <<: *service
    build:
      <<: *build
      args:
        APP: payment
    environment:
      <<: *service-env
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD:-payment_dev}@postgres:5432/payment
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

  notification:
    <<: *service
    build:
      <<: *build
      args:
        APP: notification
    # Only notification needs Mailpit.
    depends_on:
      <<: *service-deps
      mailpit: { condition: service_healthy }
    environment:
      <<: *service-env
      # Internal SMTP address; no .env override.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DATABASE_URL: postgres://notification:${NOTIFICATION_DB_PASSWORD:-notification_dev}@postgres:5432/notification
      IDENTITY_GRPC_URL: ${IDENTITY_GRPC_URL:-identity:50051}
      NOTIFICATION_IDENTITY_SERVICE_KEY: ${NOTIFICATION_IDENTITY_SERVICE_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@train.local}
      EVENT_HANDLER_TIMEOUT_MS: ${EVENT_HANDLER_TIMEOUT_MS:-3000}
      EVENT_RETRY_DELAYS_MS: ${EVENT_RETRY_DELAYS_MS:-1000,3000,9000}
      EVENT_PREFETCH: ${EVENT_PREFETCH:-10}
      EVENT_CLAIM_LEASE_SECONDS: ${EVENT_CLAIM_LEASE_SECONDS:-60}

  # Run on demand: docker compose run --rm seeder
  # The seed profile keeps it out of normal Compose startup.
  seeder:
    profiles: ['seed']
    build:
      <<: *build
      target: seeder
      args:
        APP: catalog
    depends_on: *service-deps
    environment:
      <<: *service-env
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BCRYPT_COST: ${BCRYPT_COST:-12}
      OPERATOR_SEED_PASSWORD: "${OPERATOR_SEED_PASSWORD:-Operator!Dev123}"
      CONDUCTOR_SEED_PASSWORD: "${CONDUCTOR_SEED_PASSWORD:-Conductor!Dev123}"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
