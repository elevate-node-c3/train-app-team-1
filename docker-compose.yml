name: train-app

# Every service is built from the one root Dockerfile, selected by the APP
# build arg. Only `args.APP` and `DATABASE_URL` differ between them, so the
# shared parts live in these anchors rather than seven times over.
x-build: &build
  context: .
  dockerfile: Dockerfile

x-service: &service
  restart: unless-stopped
  depends_on: &service-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  environment: &service-env
    NODE_ENV: ${NODE_ENV:-development}
    PORT: 3000
    REDIS_URL: redis://redis:6379
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # No published port: Postgres is reachable only from inside the network.
    healthcheck:
      # `$$` escapes the interpolation so Compose leaves it alone and the shell
      # inside the container reads the container's own environment.
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # The management UI publishes because the project's demos require it.
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      # The web inbox publishes for the same reason as RabbitMQ's UI.
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog:
    <<: *service
    build:
      <<: *build
      args:
        APP: catalog
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog

  # The only service reachable from outside the Compose network.
  gateway:
    <<: *service
    build:
      <<: *build
      args:
        APP: gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/gateway

  identity:
    <<: *service
    build:
      <<: *build
      args:
        APP: identity
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity

  inventory:
    <<: *service
    build:
      <<: *build
      args:
        APP: inventory
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory

  booking:
    <<: *service
    build:
      <<: *build
      args:
        APP: booking
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking

  payment:
    <<: *service
    build:
      <<: *build
      args:
        APP: payment
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment

  notification:
    <<: *service
    build:
      <<: *build
      args:
        APP: notification
    # The one service that sends mail, so the only one that waits for Mailpit.
    depends_on:
      <<: *service-deps
      mailpit: { condition: service_healthy }
    environment:
      <<: *service-env
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
