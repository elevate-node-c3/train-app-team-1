syntax = "proto3";

package train.booking.v1;

message BookingLeg {
  string tripId = 1;
  string originStationId = 2;
  string destinationStationId = 3;
}

service BookingService {
  // Public booking RPCs are bounded by the gateway's 6000ms request deadline.
  rpc SubmitBooking (SubmitBookingRequest) returns (BookingResponse);
  // Records the traveller's acceptance of the Terms and Conditions and the
  // Privacy Policy; ContinueToPayment refuses without it.
  rpc AcceptTerms (ContinueBookingRequest) returns (BookingResponse);
  rpc ContinueToPayment (ContinueToPaymentRequest) returns (BookingResponse);
  rpc AbandonBooking (ContinueBookingRequest) returns (BookingResponse);
  rpc GetBooking (ContinueBookingRequest) returns (BookingResponse);
}

message SubmitBookingRequest {
  string idempotencyKey = 1;
  repeated BookingLeg legs = 2;
  string travelClassId = 3;
  // Saved passengers by reference only (BR-09); booking reads them from identity.
  repeated string passengerIds = 4;
}

message ContinueBookingRequest {
  string bookingReference = 1;
}

message ContinueToPaymentRequest {
  string bookingReference = 1;
  string savedCardId = 2;
}

// The next five mirror catalog's wire shapes, so the Review Tickets step reads
// trains, stations and times exactly as search showed them.
message CivilDateTime {
  string localDate = 1;
  string localTime = 2;
  string utcOffset = 3;
  string iso = 4;
  string timeZone = 5;
}

message LocalizedName {
  string en = 1;
  string ar = 2;
}

message TravelClass {
  string id = 1;
  LocalizedName name = 2;
}

message TripEndpoint {
  string stationId = 1;
  LocalizedName name = 2;
  CivilDateTime at = 3;
}

message SplitNotice {
  string code = 1;
  string message = 2;
  string messageEn = 3;
}

// A passenger as reviewed at the hold. Never carries the National ID.
message BookedPassenger {
  string passengerId = 1;
  string fullName = 2;
  int32 coachNumber = 3;
  string seatNumber = 4;
  string seatLabel = 5;      // "Mona Ahmed · Coach 5 · Seat 44"
  int32 farePiastres = 6;    // this passenger on this leg
}

message BookedLeg {
  string tripId = 1;
  int32 trainNumber = 2;
  LocalizedName trainType = 3;
  TripEndpoint departure = 4;
  TripEndpoint arrival = 5;
  int32 farePiastres = 6;          // one passenger, locked at the hold (BR-30)
  string allocationOutcome = 7;    // SIDE_BY_SIDE | SAME_COACH | SPLIT
  SplitNotice splitNotice = 8;     // present only when SPLIT
  repeated BookedPassenger passengers = 9;
}

message Ticket {
  string ticketNumber = 1;
  string passengerRef = 2;
  string tripId = 3;
  int32 coachNumber = 4;
  string seatNumber = 5;
}

message BookingResponse {
  string bookingReference = 1;
  string state = 2;
  int32 totalPiastres = 3;
  string currency = 4;
  string holdExpiresAt = 5;        // set by inventory; never reset by a read
  string paymentReference = 6;
  string serverTime = 7;           // fresh on every response
  TravelClass travelClass = 8;
  repeated BookedLeg legs = 9;
  int32 fareTotalPiastres = 10;    // every passenger on every leg
  int32 bookingFeePiastres = 11;
  int32 bookingFeePercent = 12;    // 7
  string termsAcceptedAt = 13;     // '' until accepted
  repeated Ticket tickets = 14;    // only once state is 'confirmed'
  bool seatsChanged = 15;          // a late payment forced a reallocation
  string clientSecret = 16;        // owner only, while awaiting payment
}

// ---------------------------------------------------------------------------
// Tickets (TA-108). One ticket per passenger per leg, issued by the
// confirmation saga with its own immutable snapshot of what is printed on it.
// ---------------------------------------------------------------------------

service TicketService {
  // The traveller's own tickets; the owner is the caller the gateway signed on.
  rpc ListPaidTickets (ListTicketsRequest) returns (TicketPage);
  rpc ListCancelledTickets (ListTicketsRequest) returns (TicketPage);
  rpc GetTicketQr (TicketRequest) returns (TicketQr);
  rpc CreateShareLink (TicketRequest) returns (TicketShareLink);
  rpc GetTicketPdf (TicketPdfRequest) returns (TicketPdf);
  // Anyone holding the link; the token is the only credential.
  rpc GetSharedTicket (SharedTicketRequest) returns (SharedTicket);
  // Conductor only: the online check against the ticket's current state.
  rpc VerifyTicket (VerifyTicketRequest) returns (TicketVerification);
  // Traveller's own ticket: show the refund tier before any money moves.
  rpc PreviewTicketCancellation (PreviewTicketCancellationRequest) returns (PreviewTicketCancellationResponse);
  // tier is the outcome the traveller accepted; booking recomputes it
  // server-side and never trusts the caller's value.
  rpc ConfirmTicketCancellation (ConfirmTicketCancellationRequest) returns (ConfirmTicketCancellationResponse);
  // Conductor only: the public keys an offline scanner verifies QRs with.
  rpc GetVerificationKeys (VerificationKeysRequest) returns (VerificationKeys);
}

message ListTicketsRequest {
  int32 limit = 1;    // 0 means the default page size
  string cursor = 2;  // '' for the first page; nextCursor of the previous one
}

message TicketRequest {
  string ticketId = 1;
}

message PreviewTicketCancellationRequest {
  string ticketId = 1;
}

message PreviewTicketCancellationResponse {
  bool allowed = 1;
  string tier = 2;        // FULL | HALF | '' when not allowed
  int32 refundPiastres = 3;
  string code = 4;        // ErrorCode, '' when allowed
}

message ConfirmTicketCancellationRequest {
  string ticketId = 1;
  // The outcome the traveller accepted; booking recomputes it, never trusts it.
  string tier = 2;
  string idempotencyKey = 3;  // ticket:{ticketId}:cancel
}

message ConfirmTicketCancellationResponse {
  string status = 1;      // CANCELLED | ALREADY_CANCELLED
  int32 refundPiastres = 2;
}

message TicketPdfRequest {
  string ticketId = 1;
  string language = 2;  // the request's language, resolved by the gateway
}

message SharedTicketRequest {
  string token = 1;
}

message VerifyTicketRequest {
  string qr = 1;  // the scanned QR payload, verbatim
}

message VerificationKeysRequest {}

// What may be done with a ticket right now. Decided by booking, never the client.
message TicketActions {
  bool share = 1;
  bool qr = 2;
  bool download = 3;
  bool cancel = 4;
}

// Everything a ticket card shows, from the ticket's own issued snapshot.
message TicketCard {
  string ticketId = 1;
  string ticketNumber = 2;
  string bookingReference = 3;
  string bookingCode = 4;          // short, read aloud; shared by the booking's tickets
  string passengerName = 5;
  int32 trainNumber = 6;
  LocalizedName trainType = 7;
  TravelClass travelClass = 8;     // plain words, both languages (BR-22)
  int32 coachNumber = 9;
  string seatNumber = 10;
  TripEndpoint boarding = 11;      // the passenger's own station and Cairo time
  TripEndpoint alighting = 12;
  int32 durationMinutes = 13;
  int32 farePiastres = 14;         // this passenger on this leg
  string currency = 15;
  string status = 16;              // active | cancelled | voided
  string statusReason = 17;        // '' unless cancelled or voided
  string refundStatus = 18;        // '' until PAY-3 reports one
  TicketActions allowedActions = 19;
}

message TicketPage {
  repeated TicketCard tickets = 1;
  string nextCursor = 2;  // '' on the last page
}

message TicketQr {
  string payload = 1;   // the signed QR content, exactly as encoded in the image
  string keyId = 2;
  string image = 3;     // data:image/png;base64,...
}

message TicketShareLink {
  string token = 1;
  string expiresAt = 2;  // the arrival at the passenger's alighting station
}

message TicketPdf {
  bytes content = 1;
  string fileName = 2;
}

// Read-only, and never the National ID or the booking's other tickets.
message SharedTicket {
  string ticketNumber = 1;
  string passengerName = 2;
  int32 trainNumber = 3;
  LocalizedName trainType = 4;
  TravelClass travelClass = 5;
  int32 coachNumber = 6;
  string seatNumber = 7;
  TripEndpoint boarding = 8;
  TripEndpoint alighting = 9;
  int32 durationMinutes = 10;
  string expiresAt = 11;
}

message TicketVerification {
  bool valid = 1;
  // VALID | MALFORMED | INVALID_SIGNATURE | UNKNOWN_TICKET | CANCELLED | VOIDED
  string result = 2;
  string reason = 3;       // the cancellation or void reason, when there is one
  TicketCard ticket = 4;   // present once the signature holds and the ticket is found
}

message VerificationKey {
  string kid = 1;
  string kty = 2;   // OKP
  string crv = 3;   // Ed25519
  string x = 4;     // base64url public key
  string alg = 5;   // EdDSA
}

message VerificationKeys {
  repeated VerificationKey keys = 1;
}
