syntax = "proto3";

package train.inventory.v1;

// Inventory service managing seat holds, usage, and group allocation.
service InventoryService {
  rpc SeatUsageForTrips (SeatUsageForTripsRequest)
      returns (SeatUsageForTripsResponse);

  rpc HoldSeats (HoldSeatsRequest)
      returns (HoldSeatsResponse);

  rpc ReleaseSeats (ReleaseSeatsRequest)
      returns (ReleaseSeatsResponse);
}

message SeatUsageForTripsRequest {
  repeated string tripIds = 1;  // uuid, dated-trip ids

  reserved 2 to 9;  // travel-class or as-of-time narrowing, if ever needed
}

// Counts and stations travel together: the counts build the refusal message,
// and the station ids say whether a stop catalog wants to remove is in use.
message TripSeatUsage {
  string tripId = 1;
  int32 soldCount = 2;
  int32 heldCount = 3;
  repeated string stationIdsInUse = 4;

  // Sprint 3 adds per-class counts, hold expiry and per-segment splits here.
  reserved 5 to 19;
}

message SeatUsageForTripsResponse {
  repeated TripSeatUsage usages = 1;

  reserved 2 to 9;  // evaluatedAt or a page token, if ever needed
}

enum AllocationOutcome {
  ALLOCATION_OUTCOME_UNSPECIFIED = 0;
  SIDE_BY_SIDE = 1;
  SAME_COACH = 2;
  SPLIT = 3;
}

message AssignedSeat {
  string seatId = 1;
  int32 coachNumber = 2;
  string seatNumber = 3;
  int32 rowNumber = 4;
  optional string label = 5;
}

message SplitNoticePayload {
  string code = 1;
  string message = 2;
  string messageEn = 3;
}

message HoldSeatsRequest {
  string tripId = 1;
  string travelClassId = 2;
  string originStationId = 3;
  string destinationStationId = 4;
  int32 groupSize = 5;
  optional int32 ttlSeconds = 6;
  optional string bookingId = 7;
}

message HoldSeatsResponse {
  string holdId = 1;
  AllocationOutcome allocationOutcome = 2;
  repeated AssignedSeat seats = 3;
  string expiresAt = 4;
  optional SplitNoticePayload splitNotice = 5;
}

message ReleaseSeatsRequest {
  string holdId = 1;
}

message ReleaseSeatsResponse {
  bool success = 1;
}
