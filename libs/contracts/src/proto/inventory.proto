syntax = "proto3";

package train.inventory.v1;

// No seat tables yet, so every answer is zero -- a real answer, not silence.
// That lets catalog refuse a rewrite over a trip that might already be sold.
service InventoryService {
  rpc SeatUsageForTrips (SeatUsageForTripsRequest)
      returns (SeatUsageForTripsResponse);
}

message SeatUsageForTripsRequest {
  repeated string tripIds = 1;  // uuid, dated-trip ids

  reserved 2 to 9;  // travel-class or as-of-time narrowing, if ever needed
}

// Counts and stations travel together: the counts build the refusal message,
// and the station ids say whether a stop catalog wants to remove is in use.
message TripSeatUsage {
  string tripId = 1;
  int32 soldCount = 2;
  int32 heldCount = 3;
  repeated string stationIdsInUse = 4;

  // Sprint 3 adds per-class counts, hold expiry and per-segment splits here.
  reserved 5 to 19;
}

message SeatUsageForTripsResponse {
  repeated TripSeatUsage usages = 1;

  reserved 2 to 9;  // evaluatedAt or a page token, if ever needed
}
