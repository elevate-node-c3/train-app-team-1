syntax = "proto3";

package train.inventory.v1;

// Inventory service managing seat holds, usage, and group allocation.
// Holds are created only through the MT-02 lifecycle below.
service InventoryService {
  rpc SeatUsageForTrips (SeatUsageForTripsRequest)
      returns (SeatUsageForTripsResponse);

  // MT-02: private, booking-to-inventory hold lifecycle. These are never
  // exposed as gateway mutation routes.
  rpc CreateHold (CreateHoldRequest) returns (HoldView);
  rpc GetHold (GetHoldRequest) returns (HoldView);
  rpc ReleaseHold (ReleaseHoldRequest) returns (HoldView);
  rpc ExtendHold (ExtendHoldRequest) returns (HoldView);
  // BR-36: booking calls this once its payment has settled, to convert the
  // hold into a real sale, re-sell it, reallocate within the class, or refuse.
  rpc SettleHold (SettleHoldRequest) returns (SettleHoldResponse);
}

message SeatUsageForTripsRequest {
  repeated string tripIds = 1;  // uuid, dated-trip ids

  reserved 2 to 9;  // travel-class or as-of-time narrowing, if ever needed
}

// Counts and stations travel together: the counts build the refusal message,
// and the station ids say whether a stop catalog wants to remove is in use.
message TripSeatUsage {
  string tripId = 1;
  int32 soldCount = 2;
  int32 heldCount = 3;
  repeated string stationIdsInUse = 4;

  // Sprint 3 adds per-class counts, hold expiry and per-segment splits here.
  reserved 5 to 19;
}

message SeatUsageForTripsResponse {
  repeated TripSeatUsage usages = 1;

  reserved 2 to 9;  // evaluatedAt or a page token, if ever needed
}

enum AllocationOutcome {
  ALLOCATION_OUTCOME_UNSPECIFIED = 0;
  SIDE_BY_SIDE = 1;
  SAME_COACH = 2;
  SPLIT = 3;
}

message SplitNoticePayload {
  string code = 1;
  string message = 2;
  string messageEn = 3;
}

// ---------------------------------------------------------------------------
// MT-02 hold lifecycle contract.
// No client-supplied counts, ranges, TTLs, or departure times: Inventory
// resolves stops, classes, departures, and expiry from its own database.
// ---------------------------------------------------------------------------

enum HoldState {
  HOLD_STATE_UNSPECIFIED = 0;
  HELD = 1;
  RELEASED = 2;
  EXPIRED = 3;
  CANCELLED = 4;
  SOLD = 5;
}

message HoldPassengerLegIdentity {
  // The hold leg this token/version was pinned for.
  string tripId = 1;
  // Identity-issued trip-scoped HMAC token.
  string passengerToken = 2;
  // Immutable identity key version pinned for the trip.
  int32 passengerKeyVersion = 3;
}

message HoldPassengerInput {
  // Booking's submitted passenger reference, never a raw National ID.
  string passengerRef = 1;
  // One identity per hold leg. A round trip uses two different trip tokens.
  repeated HoldPassengerLegIdentity identities = 2;
}

message HoldLegInput {
  string tripId = 1;
  string travelClassId = 2;
  string originStationId = 3;
  string destinationStationId = 4;
}

message CreateHoldRequest {
  string ownerId = 1;
  string bookingKey = 2;
  repeated HoldLegInput legs = 3;
  repeated HoldPassengerInput passengers = 4;
}

message GetHoldRequest {
  string ownerId = 1;
  string bookingKey = 2;
}

message ReleaseHoldRequest {
  string ownerId = 1;
  string bookingKey = 2;
}

message ExtendHoldRequest {
  string ownerId = 1;
  string bookingKey = 2;
}

message HoldLegView {
  string tripId = 1;
  string travelClassId = 2;
  string originStationId = 3;
  string destinationStationId = 4;
  int32 originPosition = 5;
  int32 destinationPosition = 6;
  AllocationOutcome outcome = 7;
  optional SplitNoticePayload splitNotice = 8;
}

message HoldSeatAssignment {
  string passengerRef = 1;
  int32 passengerKeyVersion = 2;
  string tripId = 3;
  string tripSeatId = 4;
  string travelClassId = 5;
  int32 coachNumber = 6;
  string seatNumber = 7;
  int32 rowNumber = 8;
  optional string label = 9;
  AllocationOutcome outcome = 10;
  string originStationId = 11;
  string destinationStationId = 12;
  int32 originPosition = 13;
  int32 destinationPosition = 14;
}

message HoldView {
  string holdId = 1;
  string bookingKey = 2;
  string ownerId = 3;
  HoldState state = 4;
  int32 version = 5;
  bool extensionUsed = 6;
  // Empty only for a cancellation tombstone with no promised expiry.
  string expiresAt = 7;
  // Postgres clock_timestamp() sampled after lock waits.
  string serverNow = 8;
  AllocationOutcome allocationOutcome = 9;
  repeated HoldLegView legs = 10;
  repeated HoldSeatAssignment assignments = 11;
}

message SettleHoldRequest {
  string ownerId = 1;
  string bookingKey = 2;
}

message SettleHoldResponse {
  enum SettlementOutcome {
    SETTLEMENT_OUTCOME_UNSPECIFIED = 0;
    SOLD = 1;
    REALLOCATED = 2;
    NO_SEATS = 3;
  }

  SettlementOutcome outcome = 1;
  string holdId = 2;
  repeated HoldLegView legs = 3;
  repeated HoldSeatAssignment assignments = 4;
  // Postgres clock_timestamp() sampled after lock waits.
  string serverNow = 5;
}
