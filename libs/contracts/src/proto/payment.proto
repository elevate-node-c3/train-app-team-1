syntax = "proto3";

package train.payment.v1;

service PaymentService {
  // Booking applies an 1800ms gRPC deadline and retries with the same key.
  rpc StartCharge (StartChargeRequest) returns (StartChargeResponse);
  // Cancellation compensation applies an 1800ms deadline and retries with the same key.
  rpc CancelCharge (CancelChargeRequest) returns (CancelChargeResponse);

  // Saved Cards
  rpc CreateSetupIntent (CreateSetupIntentRequest) returns (CreateSetupIntentResponse);
  rpc ConfirmSetup (ConfirmSetupRequest) returns (SavedCardResponse);
  rpc ListSavedCards (ListSavedCardsRequest) returns (ListSavedCardsResponse);
  rpc DeleteSavedCard (DeleteSavedCardRequest) returns (DeleteSavedCardResponse);
}

message StartChargeRequest {
  string bookingReference = 1;
  int32 amountPiastres = 2;
  string currency = 3;
  string idempotencyKey = 4;
  string accountId = 5;
  string savedCardId = 6;
}

message StartChargeResponse {
  string paymentReference = 1;
  string status = 2;
}

message CancelChargeRequest {
  string bookingReference = 1;
  string paymentReference = 2;
  string idempotencyKey = 3;
}

message CancelChargeResponse {
  string status = 1;
}

message CreateSetupIntentRequest {
  string accountId = 1;
}

message CreateSetupIntentResponse {
  string setupIntentId = 1;
  string clientSecret = 2;
  string publishableKey = 3;
}

message ConfirmSetupRequest {
  string accountId = 1;
  string setupIntentId = 2;
}

message ListSavedCardsRequest {
  string accountId = 1;
}

message SavedCardItem {
  string id = 1;
  string brand = 2;
  string last4 = 3;
  int32 expMonth = 4;
  int32 expYear = 5;
  string cardholderName = 6;
  bool isDefault = 7;
  bool canPay = 8;
  bool isExpired = 9;
  string createdAt = 10;
}

message ListSavedCardsResponse {
  repeated SavedCardItem cards = 1;
}

message SavedCardResponse {
  SavedCardItem card = 1;
}

message DeleteSavedCardRequest {
  string accountId = 1;
  string cardId = 2;
}

message DeleteSavedCardResponse {
  bool success = 1;
}
